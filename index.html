<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartboard - Circle to Search</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Load Environment Variables (API Key) -->
    <!-- This loads locally. On GitHub, it will safely 404 because of .gitignore -->
    <script src="env.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #111827; touch-action: none; font-family: 'Inter', sans-serif; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #drawing-canvas { z-index: 10; }
        #overlay-canvas { z-index: 20; pointer-events: none; }
        
        /* Markdown Styling for AI Results */
        .prose h1, .prose h2, .prose h3 { color: #f3f4f6; margin-top: 1em; margin-bottom: 0.5em; font-weight: bold; }
        .prose p { color: #d1d5db; margin-bottom: 1em; line-height: 1.6; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; color: #d1d5db; margin-bottom: 1em; }
        .prose strong { color: #a855f7; }
        .prose code { background-color: #374151; padding: 0.2em 0.4em; border-radius: 0.25rem; font-family: monospace; color: #f3f4f6; }
    </style>
</head>
<body class="text-white">

    <!-- Toolbar -->
    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-30 bg-gray-800/90 backdrop-blur-md p-2 rounded-2xl shadow-2xl flex gap-2 border border-gray-700">
        <button id="btn-pen" class="p-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition text-white shadow-inner flex items-center justify-center" title="Pen">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>
        <button id="btn-eraser" class="p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center" title="Eraser">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
        <div class="w-px bg-gray-600 mx-1"></div>
        <button id="btn-lasso" class="p-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 transition text-white shadow-lg flex items-center justify-center group" title="Smart Circle">
            <svg class="w-6 h-6 transform group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </button>
        <div class="w-px bg-gray-600 mx-1"></div>
        <button id="btn-clear" class="p-3 rounded-xl bg-transparent hover:bg-red-900/50 transition text-red-400 flex items-center justify-center" title="Clear Board">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16v16H4z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M8 4v16"></path></svg>
        </button>
    </div>

    <!-- Canvases -->
    <div id="canvas-container">
        <!-- Main drawing canvas -->
        <canvas id="drawing-canvas"></canvas>
        <!-- Overlay for lasso animation and glowing box -->
        <canvas id="overlay-canvas"></canvas>
    </div>

    <!-- AI Results Side Panel -->
    <div id="search-panel" class="fixed top-0 right-0 h-full w-full md:w-96 bg-gray-900/95 backdrop-blur-xl border-l border-gray-700 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
            <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400 flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                AI Analysis
            </h2>
            <button id="close-panel" class="text-gray-400 hover:text-white p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div id="search-results" class="p-6 overflow-y-auto flex-1 prose prose-invert max-w-none">
            <!-- AI Results will be injected here as Markdown -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const searchPanel = document.getElementById('search-panel');
        const searchResults = document.getElementById('search-results');

        let isDrawing = false;
        let currentTool = 'pen'; // 'pen', 'eraser', 'lasso'
        let lastX = 0;
        let lastY = 0;
        let lassoPoints = [];
        let isLoadingData = false;
        let animationFrameId = null;

        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            if (w === 0 || h === 0) return; // Prevent 0px crash
            
            let tempCanvas = null;
            if (canvas.width > 0 && canvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);
            }

            canvas.width = w;
            canvas.height = h;
            overlayCanvas.width = w;
            overlayCanvas.height = h;

            ctx.fillStyle = '#111827'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (tempCanvas) {
                ctx.drawImage(tempCanvas, 0, 0);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        const startDrawing = (e) => {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            
            if (currentTool === 'lasso') {
                lassoPoints = [{x: lastX, y: lastY}];
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                closeSearchPanel();
            }
        };

        const draw = (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);

            if (currentTool === 'pen' || currentTool === 'eraser') {
                ctx.lineWidth = currentTool === 'pen' ? 4 : 40;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = currentTool === 'pen' ? '#ffffff' : '#111827';

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();

                lastX = pos.x;
                lastY = pos.y;
            } else if (currentTool === 'lasso') {
                lassoPoints.push({x: pos.x, y: pos.y});
                
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                
                overlayCtx.beginPath();
                overlayCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
                for (let i = 1; i < lassoPoints.length; i++) {
                    overlayCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
                }

                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';

                // Layer 1: Huge soft pink/purple shadow (Wide Aura)
                overlayCtx.lineWidth = 24;
                overlayCtx.strokeStyle = 'rgba(232, 121, 249, 0.25)';
                overlayCtx.shadowBlur = 25;
                overlayCtx.shadowColor = '#d946ef'; 
                overlayCtx.stroke();

                // Layer 2: Medium bright purple/blue glow
                overlayCtx.lineWidth = 14;
                overlayCtx.strokeStyle = 'rgba(168, 85, 247, 0.6)';
                overlayCtx.shadowBlur = 10;
                overlayCtx.shadowColor = '#a855f7'; 
                overlayCtx.stroke();

                // Layer 3: Thick White-ish Core (Frosty)
                overlayCtx.lineWidth = 6;
                overlayCtx.strokeStyle = '#ffffff';
                overlayCtx.shadowBlur = 0;
                overlayCtx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            }
        };

        const stopDrawing = () => {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (currentTool === 'lasso' && lassoPoints.length > 10) {
                processLassoArea();
            } else if (currentTool === 'lasso') {
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
        };

        // Event listeners for mouse and touch
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                e.preventDefault();
                startDrawing(e);
            }
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            if(e.touches.length === 1) {
                e.preventDefault();
                draw(e);
            }
        }, {passive: false});
        window.addEventListener('touchend', stopDrawing);

        function animateLoading(minX, minY, width, height) {
            let step = 0;
            
            function render() {
                if(!isLoadingData) return;

                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                // Darken screen (Scrim effect)
                overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                overlayCtx.fillRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                // Clear the cutout around the selected drawing
                overlayCtx.clearRect(minX, minY, width, height);

                const padding = 16;
                const bx = minX - padding;
                const by = minY - padding;
                const bw = width + padding * 2;
                const bh = height + padding * 2;

                step += 0.05;

                const bracketLength = Math.min(40, bw / 3);
                overlayCtx.lineWidth = 6;
                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';

                const cx = bx + bw/2;
                const cy = by + bh/2;
                
                // Animated Conic Gradient for the brackets
                const gradient = overlayCtx.createConicGradient(step, cx, cy);
                gradient.addColorStop(0, '#a855f7');   
                gradient.addColorStop(0.25, '#3b82f6'); 
                gradient.addColorStop(0.5, '#ec4899');  
                gradient.addColorStop(0.75, '#3b82f6'); 
                gradient.addColorStop(1, '#a855f7');   

                overlayCtx.strokeStyle = gradient;
                overlayCtx.shadowColor = '#e879f9';
                overlayCtx.shadowBlur = 15;

                // Draw Corner Brackets
                overlayCtx.beginPath();
                overlayCtx.moveTo(bx + bracketLength, by); overlayCtx.lineTo(bx, by); overlayCtx.lineTo(bx, by + bracketLength);
                overlayCtx.stroke();

                overlayCtx.beginPath();
                overlayCtx.moveTo(bx + bw - bracketLength, by); overlayCtx.lineTo(bx + bw, by); overlayCtx.lineTo(bx + bw, by + bracketLength);
                overlayCtx.stroke();

                overlayCtx.beginPath();
                overlayCtx.moveTo(bx + bracketLength, by + bh); overlayCtx.lineTo(bx, by + bh); overlayCtx.lineTo(bx, by + bh - bracketLength);
                overlayCtx.stroke();

                overlayCtx.beginPath();
                overlayCtx.moveTo(bx + bw - bracketLength, by + bh); overlayCtx.lineTo(bx + bw, by + bh); overlayCtx.lineTo(bx + bw, by + bh - bracketLength);
                overlayCtx.stroke();

                animationFrameId = requestAnimationFrame(render);
            }
            render();
        }

        async function processLassoArea() {
            // Find bounds
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            lassoPoints.forEach(p => {
                minX = Math.min(minX, p.x);
                minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x);
                maxY = Math.max(maxY, p.y);
            });

            const pad = 20;
            minX = Math.max(0, minX - pad);
            minY = Math.max(0, minY - pad);
            maxX = Math.min(canvas.width, maxX + pad);
            maxY = Math.min(canvas.height, maxY + pad);
            const width = maxX - minX;
            const height = maxY - minY;

            if (width <= 0 || height <= 0) return;

            // Crop image
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.fillStyle = '#111827';
            tempCtx.fillRect(0, 0, width, height);
            tempCtx.drawImage(canvas, minX, minY, width, height, 0, 0, width, height);

            isLoadingData = true;
            animateLoading(minX, minY, width, height);
            
            // --- GRAB THE API KEY FROM env.js ---
            let userApiKey = "";
            if (typeof window !== 'undefined' && window.ENV && window.ENV.GEMINI_API_KEY) {
                userApiKey = window.ENV.GEMINI_API_KEY;
            }

            // Check if key is completely missing (e.g. running live on GitHub Pages)
            if (!userApiKey) {
                isLoadingData = false;
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                openSearchPanel(`### ⚠️ API Key Missing
                
Because this app is running on GitHub Pages (or env.js was not found), the API key is not present. 

**For developers:** If you want this to work on a live static site, you must either provide an API key fallback, or add a text input for users to supply their own key.`);
                return;
            }

            const modelName = "gemini-1.5-flash"; // Highly stable model
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${userApiKey}`;

            openSearchPanel(`
<div class="flex flex-col items-center justify-center py-10 space-y-4">
    <div class="flex gap-2">
        <div class="w-3 h-3 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
        <div class="w-3 h-3 bg-pink-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
        <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
    </div>
    <p class="text-gray-400 animate-pulse">Analyzing image with Gemini Vision...</p>
</div>`);

            try {
                const base64Image = tempCanvas.toDataURL('image/png').split(',')[1];
                
                const prompt = `You are an expert educational tutor helping a student. Look at this whiteboard snippet and identify the core subject (a math equation, a scientific concept like a tree or cell, a historical term, etc.). 
                CRITICAL: Do NOT analyze the artistic style, line thickness, or how it was drawn. 
                - If it's a math problem, provide a clear step-by-step solution.
                - If it's a drawing of a real-world concept (e.g., a tree, a heart, a planet), provide a brief educational summary, key scientific/historical facts, and why it is important.
                - If it's handwritten text, define and explain the concept clearly.
                Keep the tone encouraging, concise, and perfectly tailored for a student's notes. Use Markdown formatting.`;

                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: prompt },
                                {
                                    inlineData: {
                                        mimeType: "image/png",
                                        data: base64Image
                                    }
                                }
                            ]
                        }
                    ]
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                isLoadingData = false;
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                if (response.ok && result.candidates && result.candidates.length > 0) {
                    const textResponse = result.candidates[0].content.parts[0].text;
                    openSearchPanel(textResponse);
                } else if (result.error) {
                    throw new Error(result.error.message || "Unknown API error");
                } else {
                    throw new Error("No readable content found in the response.");
                }

            } catch (err) {
                console.error("AI Error:", err);
                isLoadingData = false;
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                openSearchPanel(`### ⚠️ Analysis Failed\n\n**Error Details:**\n\`${err.message}\`\n\nPlease try drawing and circling again.`);
            }
        }

        function openSearchPanel(markdownText) {
            searchResults.innerHTML = marked.parse(markdownText);
            searchPanel.classList.remove('translate-x-full');
        }

        function closeSearchPanel() {
            searchPanel.classList.add('translate-x-full');
        }

        document.getElementById('close-panel').addEventListener('click', () => {
            closeSearchPanel();
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        });

        const buttons = {
            'pen': document.getElementById('btn-pen'),
            'eraser': document.getElementById('btn-eraser'),
            'lasso': document.getElementById('btn-lasso')
        };

        function selectTool(tool) {
            currentTool = tool;
            
            buttons['pen'].className = 'p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center';
            buttons['eraser'].className = 'p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center';
            buttons['lasso'].className = 'p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center group';
            
            if (tool === 'pen') {
                buttons['pen'].className = 'p-3 rounded-xl bg-gray-700 text-white shadow-inner flex items-center justify-center';
            } else if (tool === 'eraser') {
                buttons['eraser'].className = 'p-3 rounded-xl bg-gray-700 text-white shadow-inner flex items-center justify-center';
            } else if (tool === 'lasso') {
                buttons['lasso'].className = 'p-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg flex items-center justify-center group';
            }
        }

        buttons['pen'].addEventListener('click', () => selectTool('pen'));
        buttons['eraser'].addEventListener('click', () => selectTool('eraser'));
        buttons['lasso'].addEventListener('click', () => selectTool('lasso'));
        
        document.getElementById('btn-clear').addEventListener('click', () => {
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            closeSearchPanel();
        });

        selectTool('pen');
    </script>
</body>
</html>
