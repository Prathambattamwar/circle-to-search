<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartboard - Circle to Search with Images</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script async src="https://cse.google.com/cse.js?cx=972fce0209db941c2"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111827; touch-action: none; font-family: 'Inter', sans-serif; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #drawing-canvas { z-index: 10; }
        #overlay-canvas { z-index: 20; pointer-events: none; }
        
        .prose h1, .prose h2, .prose h3 { color: #f3f4f6; margin-top: 1em; margin-bottom: 0.5em; font-weight: bold; }
        .prose p { color: #d1d5db; margin-bottom: 1em; line-height: 1.6; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; color: #d1d5db; margin-bottom: 1em; }
        .prose strong { color: #a855f7; }
        .prose code { background-color: #374151; padding: 0.2em 0.4em; border-radius: 0.25rem; font-family: monospace; color: #f3f4f6; }
        
        /* Styling for the max 2 images grid below Gemini output */
        .ai-image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; margin-bottom: 16px; }
        .ai-image-card { background: #1f2937; border-radius: 0.75rem; overflow: hidden; border: 1px solid #374151; transition: transform 0.2s, border-color 0.2s; }
        .ai-image-card:hover { transform: scale(1.02); border-color: #a855f7; }
        .ai-image-item { width: 100%; height: 135px; object-fit: cover; display: block; }
        
        /* Keep the raw CSE widget off-screen while allowing it to execute image searches */
        #cse-hidden-wrapper { position: fixed; left: -9999px; top: -9999px; width: 800px; height: 800px; overflow: hidden; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="text-white">

    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-30 bg-gray-800/90 backdrop-blur-md p-2 rounded-2xl shadow-2xl flex gap-2 border border-gray-700">
        <button id="btn-pen" class="p-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition text-white shadow-inner flex items-center justify-center" title="Pen">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>
        <button id="btn-eraser" class="p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center" title="Eraser">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
        <div class="w-px bg-gray-600 mx-1"></div>
        <button id="btn-lasso" class="p-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 transition text-white shadow-lg flex items-center justify-center group" title="Smart Circle">
            <svg class="w-6 h-6 transform group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </button>
        <div class="w-px bg-gray-600 mx-1"></div>
        <button id="btn-clear" class="p-3 rounded-xl bg-transparent hover:bg-red-900/50 transition text-red-400 flex items-center justify-center" title="Clear Board">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16v16H4z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M8 4v16"></path></svg>
        </button>
    </div>

    <!-- Drawing Canvases -->
    <div id="canvas-container">
        <canvas id="drawing-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="search-panel" class="fixed top-0 right-0 h-full w-full md:w-[420px] bg-gray-900/95 backdrop-blur-xl border-l border-gray-700 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
            <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400 flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                AI Analysis & Images
            </h2>
            <button id="close-panel" class="text-gray-400 hover:text-white p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="p-4 border-b border-gray-700 bg-gray-800/30">
            <label class="block text-xs font-medium text-gray-400 mb-1">Gemini API Key</label>
            <input type="password" id="api-key-input" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition" placeholder="Paste Gemini API Key here...">
            <p class="text-[10px] text-gray-500 mt-1">Model: <code class="text-purple-400">gemini-3.8-flash</code> • Saved locally in your browser.</p>
        </div>

        <div id="search-results" class="p-6 overflow-y-auto flex-1 prose prose-invert max-w-none">
            <!-- Gemini output and max 2 images will appear here -->
        </div>

        <!-- Required Google CSE Element configured for Image Search -->
        <div id="cse-hidden-wrapper">
            <div class="gcse-search" data-gname="smartboardSearch" data-defaultToImageSearch="true"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const searchPanel = document.getElementById('search-panel');
        const searchResults = document.getElementById('search-results');
        const apiKeyInput = document.getElementById('api-key-input');

        if (localStorage.getItem('gemini_api_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_api_key');
        }

        apiKeyInput.addEventListener('input', (e) => {
            localStorage.setItem('gemini_api_key', e.target.value.trim());
        });

        let isDrawing = false;
        let currentTool = 'pen'; 
        let lastX = 0;
        let lastY = 0;
        let lassoPoints = [];
        let isLoadingData = false;
        let animationFrameId = null;

        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w === 0 || h === 0) return;
            
            let tempCanvas = null;
            if (canvas.width > 0 && canvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
            }

            canvas.width = w;
            canvas.height = h;
            overlayCanvas.width = w;
            overlayCanvas.height = h;

            ctx.fillStyle = '#111827'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (tempCanvas) {
                ctx.drawImage(tempCanvas, 0, 0);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        const startDrawing = (e) => {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            
            if (currentTool === 'lasso') {
                lassoPoints = [{x: lastX, y: lastY}];
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                closeSearchPanel();
            }
        };

        const draw = (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);

            if (currentTool === 'pen' || currentTool === 'eraser') {
                ctx.lineWidth = currentTool === 'pen' ? 4 : 40;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = currentTool === 'pen' ? '#ffffff' : '#111827';

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();

                lastX = pos.x;
                lastY = pos.y;
            } else if (currentTool === 'lasso') {
                lassoPoints.push({x: pos.x, y: pos.y});
                
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                overlayCtx.beginPath();
                overlayCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
                for (let i = 1; i < lassoPoints.length; i++) {
                    overlayCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
                }

                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';
                overlayCtx.lineWidth = 24;
                overlayCtx.strokeStyle = 'rgba(232, 121, 249, 0.25)';
                overlayCtx.shadowBlur = 25;
                overlayCtx.shadowColor = '#d946ef'; 
                overlayCtx.stroke();

                overlayCtx.lineWidth = 14;
                overlayCtx.strokeStyle = 'rgba(168, 85, 247, 0.6)';
                overlayCtx.shadowBlur = 10;
                overlayCtx.shadowColor = '#a855f7'; 
                overlayCtx.stroke();

                overlayCtx.lineWidth = 6;
                overlayCtx.strokeStyle = '#ffffff';
                overlayCtx.shadowBlur = 0;
                overlayCtx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            }
        };

        const stopDrawing = () => {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (currentTool === 'lasso' && lassoPoints.length > 10) {
                processLassoArea();
            } else if (currentTool === 'lasso') {
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
        };

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { if(e.touches.length === 1) { e.preventDefault(); startDrawing(e); } }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { if(e.touches.length === 1) { e.preventDefault(); draw(e); } }, {passive: false});
        window.addEventListener('touchend', stopDrawing);

        function animateLoading(minX, minY, width, height) {
            let step = 0;
            function render() {
                if(!isLoadingData) return;
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                overlayCtx.fillRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                overlayCtx.clearRect(minX, minY, width, height);

                const padding = 16;
                const bx = minX - padding;
                const by = minY - padding;
                const bw = width + padding * 2;
                const bh = height + padding * 2;

                step += 0.05;
                const bracketLength = Math.min(40, bw / 3);
                overlayCtx.lineWidth = 6;
                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';
                const cx = bx + bw/2;
                const cy = by + bh/2;
                
                const gradient = overlayCtx.createConicGradient(step, cx, cy);
                gradient.addColorStop(0, '#a855f7');   
                gradient.addColorStop(0.25, '#3b82f6'); 
                gradient.addColorStop(0.5, '#ec4899');  
                gradient.addColorStop(0.75, '#3b82f6'); 
                gradient.addColorStop(1, '#a855f7');   

                overlayCtx.strokeStyle = gradient;
                overlayCtx.shadowColor = '#e879f9';
                overlayCtx.shadowBlur = 15;

                overlayCtx.beginPath(); overlayCtx.moveTo(bx + bracketLength, by); overlayCtx.lineTo(bx, by); overlayCtx.lineTo(bx, by + bracketLength); overlayCtx.stroke();
                overlayCtx.beginPath(); overlayCtx.moveTo(bx + bw - bracketLength, by); overlayCtx.lineTo(bx + bw, by); overlayCtx.lineTo(bx + bw, by + bracketLength); overlayCtx.stroke();
                overlayCtx.beginPath(); overlayCtx.moveTo(bx + bracketLength, by + bh); overlayCtx.lineTo(bx, by + bh); overlayCtx.lineTo(bx, by + bh - bracketLength); overlayCtx.stroke();
                overlayCtx.beginPath(); overlayCtx.moveTo(bx + bw - bracketLength, by + bh); overlayCtx.lineTo(bx + bw, by + bh); overlayCtx.lineTo(bx + bw, by + bh - bracketLength); overlayCtx.stroke();

                animationFrameId = requestAnimationFrame(render);
            }
            render();
        }

        // Accurate Image Search: Combines canonical Wikipedia lead images + disambiguated CSE Image tab results
        async function getMaxTwoImages(topicName, specificVisualQuery, userKey) {
            const cleanTopic = topicName.replace(/[^a-zA-Z0-9 ]/g, '').trim();
            const cleanVisual = (specificVisualQuery || cleanTopic).replace(/[^a-zA-Z0-9 ]/g, '').trim();
            if (!cleanTopic) return [];

            const results = [];
            const seenUrls = new Set();

            const addResult = (url, title) => {
                if (url && url.startsWith('http') && !url.includes('cleardot.gif') && !url.endsWith('.svg') && !url.endsWith('.pdf') && !seenUrls.has(url)) {
                    seenUrls.add(url);
                    results.push({ url, title: title || cleanTopic });
                }
            };

            // 1. Fetch exact canonical encyclopedia photo for the core noun (e.g., "House" -> actual photo of a house)
            try {
                const wikiLeadUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(cleanTopic)}&prop=pageimages|images&piprop=original|thumbnail&pithumbsize=600&redirects=1&format=json&origin=*`;
                const leadRes = await fetch(wikiLeadUrl);
                const leadData = await leadRes.json();
                if (leadData.query && leadData.query.pages) {
                    const pages = Object.values(leadData.query.pages);
                    for (const p of pages) {
                        const mainImg = p.thumbnail?.source || p.original?.source;
                        if (mainImg) addResult(mainImg, p.title);
                    }
                }
            } catch (e) {
                console.warn("Wikipedia lead image lookup skipped:", e);
            }

            // 2. Trigger embedded <div class="gcse-search"> with the disambiguated visual query (e.g. "residential house building exterior photo")
            if (results.length < 2) {
                const cseImages = await new Promise((resolve) => {
                    try {
                        if (window.google && window.google.search && window.google.search.cse && window.google.search.cse.element) {
                            const cseElem = window.google.search.cse.element.getElement('smartboardSearch') || window.google.search.cse.element.getAllElements()[0];
                            if (cseElem) {
                                const wrapper = document.getElementById('cse-hidden-wrapper');
                                if (wrapper) {
                                    wrapper.querySelectorAll('img.gs-image').forEach(img => img.removeAttribute('src'));
                                }
                                cseElem.execute(cleanVisual);
                                let attempts = 0;
                                const poll = setInterval(() => {
                                    attempts++;
                                    if (wrapper) {
                                        // Force switching to the Image tab inside CSE if present so we don't scrape web page banners
                                        const tabs = wrapper.querySelectorAll('.gsc-tabHeader');
                                        tabs.forEach(tab => {
                                            if (tab.textContent && tab.textContent.toLowerCase().includes('image') && !tab.classList.contains('gsc-tabhActive')) {
                                                tab.click();
                                            }
                                        });

                                        // Prefer true image results (.gsc-imageResult), fallback to .gs-image
                                        let imgs = Array.from(wrapper.querySelectorAll('.gsc-imageResult img.gs-image'));
                                        if (imgs.length === 0 && attempts > 5) {
                                            imgs = Array.from(wrapper.querySelectorAll('img.gs-image'));
                                        }

                                        const validUrls = imgs
                                            .map(img => img.src)
                                            .filter(src => src && src.startsWith('http') && !src.includes('cleardot.gif'));

                                        if (validUrls.length >= 2 || attempts >= 10) {
                                            clearInterval(poll);
                                            resolve(validUrls.slice(0, 2));
                                        }
                                    } else if (attempts >= 10) {
                                        clearInterval(poll);
                                        resolve([]);
                                    }
                                }, 250);
                                return;
                            }
                        }
                    } catch (err) {
                        console.warn("CSE widget lookup skipped:", err);
                    }
                    resolve([]);
                });

                cseImages.forEach(url => addResult(url, cleanTopic));
            }

            // 3. If we still need a second real photo of the subject, fetch from Wikimedia Commons using the visual query
            if (results.length < 2) {
                try {
                    const commonsUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap%20${encodeURIComponent(cleanVisual)}&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
                    const commonsRes = await fetch(commonsUrl);
                    const commonsData = await commonsRes.json();
                    if (commonsData.query && commonsData.query.pages) {
                        const pages = Object.values(commonsData.query.pages);
                        for (const p of pages) {
                            const imgUrl = p.imageinfo?.[0]?.thumburl || p.imageinfo?.[0]?.url;
                            const cleanTitle = (p.title || '').replace('File:', '').replace(/\.[^/.]+$/, '');
                            // Filter out obvious movie posters, logos, or text banners
                            if (imgUrl && !/poster|logo|banner|icon|diagram|chart/i.test(cleanTitle)) {
                                addResult(imgUrl, cleanTitle);
                            }
                            if (results.length >= 2) break;
                        }
                    }
                } catch (e) {
                    console.warn("Wikimedia fallback error:", e);
                }
            }

            return results.slice(0, 2);
        }

        async function processLassoArea() {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            lassoPoints.forEach(p => {
                minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
            });

            const pad = 20;
            minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
            maxX = Math.min(canvas.width, maxX + pad); maxY = Math.min(canvas.height, maxY + pad);
            const width = maxX - minX; const height = maxY - minY;

            if (width <= 0 || height <= 0) return;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width; tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.fillStyle = '#111827';
            tempCtx.fillRect(0, 0, width, height);
            tempCtx.drawImage(canvas, minX, minY, width, height, 0, 0, width, height);

            const userKey = apiKeyInput.value.trim();
            if (!userKey) {
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                openSearchPanel(`### 🔑 API Key Required\n\nPlease paste your valid Gemini API key in the box above before circling.`);
                apiKeyInput.focus();
                return;
            }

            isLoadingData = true;
            animateLoading(minX, minY, width, height);

            openSearchPanel(`
                <div class="flex flex-col items-center justify-center py-12 space-y-4">
                    <div class="flex gap-2">
                        <div class="w-3 h-3 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-3 h-3 bg-pink-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                    <p class="text-gray-400 animate-pulse text-sm">Analyzing with gemini-3.8-flash & searching real photos...</p>
                </div>
            `, true);

            try {
                const base64Image = tempCanvas.toDataURL('image/png').split(',')[1];
                
                const prompt = `Identify the core subject in this drawing, diagram, or handwritten note.
First line MUST be strictly formatted as:
SEARCH_TERM: <1 to 2 word exact noun of the recognized object, e.g., House, Tree, Heart>
Second line MUST be strictly formatted as:
IMAGE_QUERY: <specific 3 to 5 word visual photo search query to find a real physical photo of this exact object and avoid movies/hospitals/logos, e.g., residential house building exterior photo>

Then, starting on the third line, provide a comprehensive, detailed educational breakdown of the subject (definitions, key components, how it works, and real-world applications) using clean Markdown headings and bullet points. Do not include generic introductory preambles.`;

                const payload = {
                    contents: [{
                        role: "user",
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "image/png", data: base64Image } }
                        ]
                    }]
                };

                // Using gemini-3.8-flash as requested
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(userKey)}`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (!response.ok || !result.candidates || !result.candidates[0]?.content?.parts?.[0]?.text) {
                    throw new Error(result.error?.message || "Failed to get response from gemini-3.8-flash");
                }

                const rawAiText = result.candidates[0].content.parts[0].text;

                // Extract recognized subject text and disambiguated visual query from Gemini's output
                let searchQuery = "House";
                let visualQuery = "";
                let cleanMarkdown = rawAiText;

                const termMatch = rawAiText.match(/^SEARCH_TERM:\s*(.+)$/m);
                if (termMatch && termMatch[1]) {
                    searchQuery = termMatch[1].replace(/[*_`]/g, '').trim();
                    cleanMarkdown = cleanMarkdown.replace(/^SEARCH_TERM:\s*.+\n?/m, '').trim();
                }

                const visualMatch = cleanMarkdown.match(/^IMAGE_QUERY:\s*(.+)$/m);
                if (visualMatch && visualMatch[1]) {
                    visualQuery = visualMatch[1].replace(/[*_`]/g, '').trim();
                    cleanMarkdown = cleanMarkdown.replace(/^IMAGE_QUERY:\s*.+\n?/m, '').trim();
                } else {
                    visualQuery = `${searchQuery} real physical object photo`;
                }

                // Fetch max 2 accurate images for the recognized object
                const images = await getMaxTwoImages(searchQuery, visualQuery, userKey);

                isLoadingData = false;
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                let htmlOutput = marked.parse(cleanMarkdown);

                // Render max 2 images directly below Gemini's output
                htmlOutput += `
                    <div class="mt-6 pt-4 border-t border-gray-700">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold uppercase tracking-wider text-purple-400">Images for: ${searchQuery}</span>
                            <span class="text-[11px] text-gray-500">Max 2 Results</span>
                        </div>
                `;

                if (images.length > 0) {
                    htmlOutput += `<div class="ai-image-grid">`;
                    images.slice(0, 2).forEach(img => {
                        htmlOutput += `
                            <a href="${img.url}" target="_blank" rel="noopener noreferrer" class="ai-image-card block" title="${img.title}">
                                <img src="${img.url}" class="ai-image-item" alt="${searchQuery}" onerror="this.parentElement.style.display='none'" />
                            </a>
                        `;
                    });
                    htmlOutput += `</div>`;
                } else {
                    htmlOutput += `<p class="text-xs text-gray-500 italic">No matching images found for "${searchQuery}".</p>`;
                }

                htmlOutput += `</div>`;

                openSearchPanel(htmlOutput, true);

            } catch (err) {
                isLoadingData = false;
                cancelAnimationFrame(animationFrameId);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                openSearchPanel(`### ⚠️ Analysis Failed\n\n**Error Details:**\n\`${err.message}\`\n\nPlease verify your API key and model availability.`);
            }
        }

        function openSearchPanel(content, isHtml = false) {
            searchResults.innerHTML = isHtml ? content : marked.parse(content);
            searchPanel.classList.remove('translate-x-full');
        }

        function closeSearchPanel() {
            searchPanel.classList.add('translate-x-full');
        }

        document.getElementById('close-panel').addEventListener('click', () => {
            closeSearchPanel();
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        });

        const buttons = {
            'pen': document.getElementById('btn-pen'),
            'eraser': document.getElementById('btn-eraser'),
            'lasso': document.getElementById('btn-lasso')
        };

        function selectTool(tool) {
            currentTool = tool;
            buttons['pen'].className = 'p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center';
            buttons['eraser'].className = 'p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center';
            buttons['lasso'].className = 'p-3 rounded-xl bg-transparent hover:bg-gray-700 transition text-gray-400 flex items-center justify-center group';
            
            if (tool === 'pen') buttons['pen'].className = 'p-3 rounded-xl bg-gray-700 text-white shadow-inner flex items-center justify-center';
            else if (tool === 'eraser') buttons['eraser'].className = 'p-3 rounded-xl bg-gray-700 text-white shadow-inner flex items-center justify-center';
            else if (tool === 'lasso') buttons['lasso'].className = 'p-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg flex items-center justify-center group';
        }

        buttons['pen'].addEventListener('click', () => selectTool('pen'));
        buttons['eraser'].addEventListener('click', () => selectTool('eraser'));
        buttons['lasso'].addEventListener('click', () => selectTool('lasso'));
        
        document.getElementById('btn-clear').addEventListener('click', () => {
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            closeSearchPanel();
        });

        selectTool('pen');
    </script>
</body>
</html>
